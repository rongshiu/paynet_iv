[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paynet-iv"
version = "0.1.0"
description = "PySpark ingestion, cleaning, PII handling and analysis of a messy credit-card transaction feed"
readme = "README.md"
# This Spark/Py4J combination is tested against Python 3.10 and 3.11.
requires-python = ">=3.10,<3.12"

# Pin the data stack so notebook results stay reproducible.
dependencies = [
    "pyspark==3.5.3",
    "pyarrow==17.0.0",   # powers toPandas() and pandas_udf
    "pandas==2.2.3",
    "numpy==1.26.4",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
# Notebook runtime only.
notebook = [
    "jupyterlab==4.2.5",
    "notebook==7.2.2",
    "ipykernel==6.29.5",
    # JupyterLab 4.2.5 still passes the proxies= argument removed in httpx 0.28.
    "httpx==0.27.2",
]

[tool.setuptools.packages.find]
where = ["src"]
